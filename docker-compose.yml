# Levanta PostgreSQL y MySQL con sus esquemas. MongoDB se usa con tu instancia local (Compass).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: hospital_general }
    ports: ["5432:5432"]
    volumes: ["./database/postgres.sql:/docker-entrypoint-initdb.d/01.sql:ro"]
  mysql:
    image: mysql:8
    environment: { MYSQL_ROOT_PASSWORD: root }
    ports: ["3306:3306"]
    volumes: ["./database/mysql.sql:/docker-entrypoint-initdb.d/01.sql:ro"]
